<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Без тишины</title>
<style>
  body { margin: 0; }
  #noisy { width: 80px; height: 80px; margin: 40px; background: #c88; }
</style>
</head>
<body>
  <div id="noisy"></div>
<script>
  const noisy = document.getElementById('noisy');
  let i = 0;
  setInterval(() => {
    i += 1;
    noisy.style.transform = `translateX(${(i % 10) * 4}px)`;
  }, 200);
</script>
</body>
</html>
