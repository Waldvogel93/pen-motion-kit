<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плавная прокрутка</title>
<style>
  /* Как на mercury.com: фокус поля вверху страницы прокручивает её плавно, а не сразу. */
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  .field { position: relative; margin: 80px 40px 40px; }
  /* Подсказка — сосед поля, не внутри него: появляется по фокусу. */
  #hint { position: absolute; top: -32px; left: 0; opacity: 0; translate: 0 4px; transition: opacity 150ms, translate 150ms; }
  .field:focus-within #hint { opacity: 1; translate: 0 0; }
  #mail { padding: 8px; font: inherit; }
  .spacer { height: 3000px; }
  #far { margin: 40px; padding: 12px 20px; font: inherit; }
</style>
</head>
<body>
  <div class="field"><div id="hint">Подсказка</div><input id="mail" type="email" placeholder="Почта"></div>
  <div class="spacer"></div>
  <button id="far">Внизу</button>
</body>
</html>
