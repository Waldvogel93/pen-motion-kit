<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фикстура движения</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #222; }
  .cards { display: flex; gap: 16px; padding: 24px; }
  .card {
    width: 200px; padding: 16px; border: 1px solid #ddd; border-radius: 12px;
    animation: fade-up 600ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .card:nth-child(2) { animation-delay: 80ms; }
  .card:nth-child(3) { animation-delay: 160ms; }
  .card:nth-child(4) { animation-delay: 240ms; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: none; }
  }
  .row { display: flex; gap: 24px; align-items: center; padding: 0 24px 24px; }
  #cta { padding: 12px 20px; font: inherit; transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  #cta:hover { transform: translateY(-2px); }
  #waapi, #js { padding: 12px; background: #eef; }
  #spinner {
    width: 24px; height: 24px; border: 3px solid #ccc; border-top-color: #333; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #email { padding: 8px; font: inherit; transition: box-shadow 150ms ease-out; }
  #email:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 120, 255, 0.4); }
  .spacer { height: 1400px; }
  #reveal { height: 200px; background: #efe; opacity: 0; transition: opacity 500ms ease-out; }
  #reveal.in { opacity: 1; }
  #slide { padding: 12px; background: #fee; transition: transform 300ms ease-in-out; }
  #split { padding: 12px; background: #eef; }
  #gone { padding: 12px; background: #eee; transition: transform 300ms ease; }
  .tail { height: 600px; }
</style>
</head>
<body>
  <div class="cards">
    <div class="card"><h3>Один</h3><p>Карточка</p></div>
    <div class="card"><h3>Два</h3><p>Карточка</p></div>
    <div class="card"><h3>Три</h3><p>Карточка</p></div>
    <div class="card"><h3>Четыре</h3><p>Карточка</p></div>
  </div>
  <div class="row">
    <button id="cta">Начать</button>
    <div id="waapi">WAAPI</div>
    <div id="js">JS</div>
    <div id="spinner"></div>
    <input id="email" type="email" placeholder="Почта">
    <svg width="120" height="80" viewBox="0 0 120 80"><g id="lottie-like" transform="translate(0, 30)"><rect width="40" height="40" fill="#333"/></g></svg>
    <div id="slide">CSS-переход от JS</div>
    <div id="split">Motion</div>
    <div id="gone">Переход отменён</div>
  </div>
  <div class="spacer"></div>
  <div id="reveal">Появляюсь при прокрутке</div>
  <div class="tail"></div>
<script>
  // y кубической кривой Безье при заданном x (бисекция).
  function bezier(x1, y1, x2, y2) {
    const b = (a, c, s) => 3 * a * s * (1 - s) ** 2 + 3 * c * s * s * (1 - s) + s ** 3;
    return (x) => {
      let lo = 0, hi = 1;
      for (let i = 0; i < 30; i++) {
        const mid = (lo + hi) / 2;
        if (b(x1, x2, mid) < x) lo = mid; else hi = mid;
      }
      return b(y1, y2, (lo + hi) / 2);
    };
  }
  function tween(duration, ease, apply) {
    const start = performance.now();
    apply(0);
    const step = (now) => {
      const p = Math.min(1, Math.max(0, (now - start) / duration));
      apply(ease(p));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  document.getElementById('waapi').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: 'ease-out' });

  const js = document.getElementById('js');
  tween(500, bezier(0.23, 1, 0.32, 1), (v) => { js.style.transform = `translateY(${40 * (1 - v)}px)`; });

  const g = document.getElementById('lottie-like');
  tween(400, (p) => 1 - (1 - p) ** 3, (v) => g.setAttribute('transform', `translate(0, ${30 * (1 - v)})`));

  // JS один раз ставит style.transform, движение делает CSS-переход: запись должна быть одна, точная.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('slide').style.transform = 'translateX(40px)';
  }));

  // Как у Motion (framer-motion): прозрачность — WAAPI, сдвиг — JS в главном потоке, на одном элементе.
  const split = document.getElementById('split');
  split.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, easing: 'ease-out' });
  tween(500, bezier(0.23, 1, 0.32, 1), (v) => { split.style.transform = `translateY(${40 * (1 - v)}px)`; });

  // CSS-переход, которого уже нет, когда регистратор разбирает пачку событий (здесь — отменён сразу).
  const gone = document.getElementById('gone');
  gone.addEventListener('transitionrun', () => gone.getAnimations().forEach((a) => a.cancel()));
  requestAnimationFrame(() => requestAnimationFrame(() => { gone.style.transform = 'translateX(20px)'; }));

  new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) e.target.classList.add('in');
  }, { threshold: 0.1 }).observe(document.getElementById('reveal'));
</script>
</body>
</html>
