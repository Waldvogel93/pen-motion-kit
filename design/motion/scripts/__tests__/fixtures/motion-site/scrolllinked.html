<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фикстура прокрутки</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #222; }
  .page { position: relative; height: 6000px; }
  #parallax { position: absolute; top: 200px; left: 40px; width: 600px; height: 300px; background: #eef; }
  #scrub { position: absolute; top: 1600px; left: 700px; width: 200px; height: 200px; background: #fee; }
  #jsreveal { position: absolute; top: 2600px; left: 40px; width: 400px; height: 200px; background: #efe; }
  #bounce { position: absolute; top: 3400px; left: 40px; width: 200px; height: 100px; background: #ffe; }
</style>
</head>
<body>
  <div class="page">
    <div id="parallax">Параллакс</div>
    <div id="scrub">Scrub</div>
    <div id="jsreveal">Проявление по времени</div>
    <div id="bounce">Туда и обратно</div>
  </div>
<script>
  // Параллакс и scrub: значение — от прокрутки, а не от времени.
  const parallax = document.getElementById('parallax');
  const scrub = document.getElementById('scrub');
  addEventListener('scroll', () => {
    parallax.style.transform = `translateY(${Math.round(scrollY * 0.3)}px)`;
    const p = Math.min(1, Math.max(0, (scrollY - 600) / 2400));
    scrub.style.transform = `rotate(${(p * 90).toFixed(2)}deg) scale(${(1 + p * 0.5).toFixed(3)})`;
  });

  function tween(duration, apply) {
    const start = performance.now();
    apply(0);
    const step = (now) => {
      const p = Math.min(1, Math.max(0, (now - start) / duration));
      apply(p);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // По времени, но запускается прокруткой: проявление 500 мс и «подскок» туда-обратно 600 мс.
  const once = (el, run) => new IntersectionObserver((entries, io) => {
    if (entries.some((e) => e.isIntersecting)) {
      io.disconnect();
      run();
    }
  }, { threshold: 0.1 }).observe(el);
  const reveal = document.getElementById('jsreveal');
  once(reveal, () => tween(500, (p) => { reveal.style.transform = `translateY(${40 * (1 - p) ** 3}px)`; }));
  const bounce = document.getElementById('bounce');
  once(bounce, () => tween(600, (p) => { bounce.style.transform = `translateY(${p >= 1 ? 0 : -30 * Math.sin(Math.PI * p)}px)`; }));
</script>
</body>
</html>
