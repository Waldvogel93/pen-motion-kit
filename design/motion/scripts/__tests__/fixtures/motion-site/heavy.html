<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>500 анимаций</title>
<style>
  body { margin: 0; }
  #grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
  .box { width: 20px; height: 20px; background: #888; animation: pop 400ms ease-out both; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  for (let i = 0; i < 500; i++) {
    const box = document.createElement('div');
    box.className = 'box';
    grid.append(box);
  }
</script>
</body>
</html>
